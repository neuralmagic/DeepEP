[project]
name = "deep-ep"
version = "1.1.0"
description = "DeepSeek Efficient Parallel Processing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.1",
    "setuptools",
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "torch"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.hpp", "*.cuh", "*.h"]

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 88

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["tests", "deep_ep"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E", "W",
    # Pyflakes
    "F",
    # pyupgrade
    # "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    # "I",
]
ignore = [
    # Module level import not at top of file
    "E402",
    # star imports
    "F405", "F403",
    # ambiguous name
    "E741",
    # line too long
    "E501",
    # key in dict.keys()
    "SIM118",
    # memory leaks
    "B019",
    # No such file or directory
    "E902",
]
exclude = [
    "deep_ep/__init__.py"
]
